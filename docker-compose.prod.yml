name: growkaro-prod
services:
  postgres:
    image: postgres:16-alpine
    container_name: growkaro-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-growkaro_db}
      POSTGRES_USER: ${POSTGRES_USER:-growkaro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-growkaro123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-growkaro} -d ${POSTGRES_DB:-growkaro_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - growkaro-network

  redis:
    image: redis:7-alpine
    container_name: growkaro-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - growkaro-network

  backend:
    image: growwkaro/backend:v1
    container_name: growkaro-backend-01
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 4000
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-growkaro_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-growkaro}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-growkaro123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # for production
      # FRONTEND_URL: https://growwkaro.com
      # for testing
      FRONTEND_URL: https://localhost:3000
    expose:
      - "4000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - growkaro-network

  backend-backup:
    image: growwkaro/backend:v1
    container_name: growkaro-backend-02
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 4000
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-growkaro_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-growkaro}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-growkaro123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # for production
      # FRONTEND_URL: https://growwkaro.com
      # for testing
      FRONTEND_URL: https://localhost:3000
    expose:
      - "4000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - growkaro-network

  frontend:
    image: growwkaro/frontend:v1
    container_name: growkaro-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      backend-backup:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      ADMIN_EMAILS: ["growkaroanand@gmail.com",]
    expose:
      - "3000"
    networks:
      - growkaro-network

  nginx:
    image: nginx:1.27-alpine
    container_name: growkaro-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      backend-backup:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - growkaro-network

  certbot:
    image: certbot/certbot
    container_name: growkaro-certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "8888:8080"
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  certbot_certs:
  certbot_www:

networks:
  growkaro-network:
    driver: bridge

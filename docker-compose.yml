services:
  postgres:
    image: postgres:16-alpine
    container_name: growkaro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-growkaro_db}
      POSTGRES_USER: ${POSTGRES_USER:-growkaro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-growkaro123}
    ports:
      - "5432:5432"
    volumes:
      - C:\Users\Asus\Documents\Anand\2026-11-05_11-35-05\growwkaro_postgres-data_2026-11-05_11-35-05:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-growkaro} -d ${POSTGRES_DB:-growkaro_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8.9
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example11.com
      PGADMIN_DEFAULT_PASSWORD: secret123
    ports:
      - "8081:80"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: growkaro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  dozzle:
    image: amir20/dozzle:latest
    container_name: growkaro-dozzle
    restart: unless-stopped
    ports:
      - "9999:8080"
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_TAILSIZE: 300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---------------------------------------------------------------
  # Monitoring stack: Prometheus + Grafana + exporters
  # ---------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: growkaro-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-growkaro}:${POSTGRES_PASSWORD:-growkaro123}@postgres:5432/${POSTGRES_DB:-growkaro_db}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: growkaro-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: growkaro-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: growkaro-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets Prometheus reach a backend running on your host
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    depends_on:
      - postgres-exporter
      - redis-exporter
      - cadvisor

  grafana:
    image: grafana/grafana:11.1.0
    container_name: growkaro-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"   # 3000 is reserved for the Next.js frontend
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # ---------------------------------------------------------------
  # App services (uncomment when ready)
  # ---------------------------------------------------------------

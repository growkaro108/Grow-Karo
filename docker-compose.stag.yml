services:
  postgres:
    image: postgres:16-alpine
    container_name: growkaro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: growkaro_db
      POSTGRES_USER: growkaro
      POSTGRES_PASSWORD: growkaro123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growkaro -d growkaro_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - growkaro-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: secret
    ports:
      - "8081:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - growkaro-network

  redis:
    image: redis:7-alpine
    container_name: growkaro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - growkaro-network

  backend:
    image: growwkaro/backend:v2
    container_name: growkaro-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 4000
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/growkaro_db
      SPRING_DATASOURCE_USERNAME: growkaro
      SPRING_DATASOURCE_PASSWORD: growkaro123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - growkaro-network

  frontend:
    image: growwkaro/frontend:v2
    container_name: growkaro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost/api
    ports:
      - "3000:3000"
    networks:
      - growkaro-network

  nginx:
    image: nginx:1.27-alpine
    container_name: growkaro-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx/local/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - growkaro-network

volumes:
  postgres-data:
  redis-data:
  uploads_data:

networks:
  growkaro-network:
    driver: bridge
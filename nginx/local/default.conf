# -------------------------------------------------------------
# Hide nginx version number (info disclosure fix)
# -------------------------------------------------------------
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream frontend_upstream {
    server frontend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream backend_upstream {
    server backend:4000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 50M;

    # -------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # NOTE: HSTS should only be enabled once the site is served over HTTPS.
    # If you're on plain HTTP (listen 80) with no TLS termination in front,
    # leave this commented out — it will break HTTP-only access.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Permissions-Policy: lock down browser features you don't use.
    # Adjust the list to match what your app actually needs.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Content-Security-Policy: start permissive enough for a Next.js app
    # (inline scripts/styles are common in Next.js), then tighten later.
    # TEST THIS ON STAGING FIRST — a strict CSP can break your frontend.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    # -------------------------------------------------------------
    # Strip framework/server fingerprinting headers
    # (Next.js sends X-Powered-By, backend may send its own too)
    # -------------------------------------------------------------
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # -------------------------------------------------------------
    # Standard Backend API Proxying
    # -------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        # Preserve the /api prefix expected by the Spring controllers and
        # Spring Security rules.
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # -------------------------------------------------------------
    # SSE Notification Stream (Fixed URI Pass-through)
    # -------------------------------------------------------------
    location ~ ^/api/(user/[^/]+|remitter/[^/]+|admin)/notifications/stream$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # -------------------------------------------------------------
    # SSE Activity Logs Stream
    # -------------------------------------------------------------
    location /api/admin/activity-logs/stream$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        add_header X-Accel-Buffering no;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # -------------------------------------------------------------
    # Health Check Endpoint
    # -------------------------------------------------------------
    location = /api/health {
        access_log off;
        proxy_pass http://backend_upstream/api/health;
        proxy_set_header Host $host;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # -------------------------------------------------------------
    # Next.js Frontend Proxying (Root & Static Assets)
    # -------------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
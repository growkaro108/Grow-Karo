# now for local only


global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      # use "backend:4000" once the backend service is uncommented in compose
      - targets: ["host.docker.internal:9090"]

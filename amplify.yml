version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd Grow-Karo
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: Grow-Karo/.next
    files:
      - '**/*'
  cache:
    paths:
      - Grow-Karo/node_modules/**/*
      - Grow-Karo/.next/cache/**/*

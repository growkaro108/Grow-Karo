server:
  port: ${SERVER_PORT:4000}

  # HTTP Compression
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 2048
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/growkaro_db}
    username: ${SPRING_DATASOURCE_USERNAME:growkaro}
    password: ${SPRING_DATASOURCE_PASSWORD:growkaro123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms
  # 3. Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 10m # Set explicit duration (10 minutes)
      cache-null-values: false

app:
  storage:
    type: local
    local:
      base-path: ${STORAGE_BASE_PATH:/app/uploads}   # mount a Docker volume here
      base-url: /uploads                              # relative — frontend prepends API host
frontend:
  url: ${FRONTEND_URL:http://localhost:3000}  # Define the frontend URL for CORS configuration
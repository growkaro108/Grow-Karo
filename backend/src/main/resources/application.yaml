server:
  port: 9090
  # HTTP Compression
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 2048

spring:
  application:
    name: backend

  # 1. PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:growkaro_db}
    username: ${DB_USERNAME:growkaro}
    password: ${DB_PASSWORD:growkaro123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000

  # 2. Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000

  # 3. Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 10m # Set explicit duration (10 minutes)
      cache-null-values: false

  # 4. JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update # Change to 'validate' or 'none' for production
    show-sql: false # Set to true during local development only
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 5. Logging Configuration
  main:
    # Disable the Spring Boot banner
    banner-mode: "off"
    # Start beans only when needed
  #    lazy-initialization: true

  # Suppress most logs, show WARN and ERROR
  # logging:
  #   level:
  #     root: WARN
  #     org:
  #       springframework: WARN
  #       hibernate: OFF
  #       hibernate.SQL: OFF
  #       apache: OFF
  #     com:
  #       zaxxer:
  #         hikari: OFF
  #     io:
  #       netty: OFF
  #     reactor: OFF

  # 5. Mail Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:growkaroanand@gmail.com}
    password: ${MAIL_PASSWORD:rbkg mucs oxkl oqcp}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            protocols: TLSv1.2 TLSv1.3
            trust: smtp.gmail.com
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days
    cookie-name: authToken
  storage:
    type: local
    local:
      base-path: ./uploads
      base-url: /uploads # relative — frontend prepends API host; works in dev + Docker
frontend:
  url: ${FRONTEND_URL:http://localhost:3000}
  # url: ${FRONTEND_URL:https://deer-queen-antiques-luther.trycloudflare.com}

admin:
  email: ${ADMIN_EMAIL:"wv9304@gmail.com"}

